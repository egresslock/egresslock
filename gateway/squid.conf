# egresslock-gateway Squid config (generated image default).
# egresslock manages /etc/squid/egresslock/ contents; this file only sets
# the fail-closed base: listen on 3128, allow the profile subnet, deny all.
# The hostname allowlist ACL is included from /etc/squid/egresslock/allowlist.conf
# which egresslock (re)generates and validates before swap.
http_port 3128

# Minimal daemon settings for a container. The whole container runs as
# the proxy user (no privilege drop at runtime), so the pid file lives
# somewhere proxy-writable.
pid_filename /tmp/squid.pid
# Keep container stops graceful and fast (podman default wait is 10s).
shutdown_lifetime 2 seconds
coredump_dir /var/spool/squid
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache deny all

# Profile subnet only (example range; egresslock rewrites this per profile)
acl profile_subnet src 10.199.2.0/24

# Hostname allowlist (generated; fail closed when missing).
# EGL-146-D1: `-n` — no rDNS adoption for IP-literal CONNECTs, matching
# the engine-generated dstdomain form (empty file before first ensure,
# so rDNS cannot match before then either).
acl allowlist dstdomain -n "/etc/squid/egresslock/allowlist.conf"

# Always deny nothing-before-everything: order is allowlist first,
# then everything else denied.
http_access allow profile_subnet allowlist
http_access deny all
