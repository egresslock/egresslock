# main.conf — starter profile for a fresh account (ARC-19).
#
# Fail-closed default: the allowlist shipped next to this file is EMPTY,
# so the gateway denies all egress. This is the shape you grow with
# `egresslock denied` / `allow` as you learn real destinations.
#
# Grammar reference — the other rule shapes, commented OUT (inactive):
#     rule allow-host git.example.test:443   # scoped host:port allow
#                                            # (hostname or IPv4 literal;
#                                            #  CIDR ranges are rejected)
#     rule public-only                       # accept all public IPv4
#                                            # (still drops RFC1918 etc.)
#
# The profile subnet is an UNUSED example range; edit it to match your
# host. The gateway IP is inside the profile subnet (the bridge gateway
# is the first usable address, the anchor the last).
profile main 10.199.0.0/24
    rule gateway-only
    gateway 10.199.0.2 3128 main-allowlist
